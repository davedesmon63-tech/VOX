<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENGLISH READER BOSS - LYCEE A</title>
<style>
  :root { --bleu: #2563EB; --vert: #16A34A; --or: #FACC15; --bg: #F8FAFC; --noir: #1E293B; }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
  body { background: var(--bg); padding-bottom: 90px; }
 .header { background: linear-gradient(135deg, var(--bleu), var(--vert)); color: white; text-align: center; padding: 25px; border-bottom: 5px solid var(--or); }
 .header h1 { font-size: 22px; }
 .container { padding: 20px; max-width: 900px; margin: auto; }
 .card { background: white; border: 3px solid var(--or); border-radius: 20px; padding: 25px; margin-bottom: 20px; }
 .level-btn { padding: 18px; background: white; border: 3px solid var(--bleu); border-radius: 15px; font-weight: 900; font-size: 17px; cursor: pointer; width: 100%; margin-bottom: 12px; }
 .level-btn:hover { background: var(--bleu); color: white; }
 .text-box { background: var(--bg); padding: 25px; border-radius: 15px; font-size: 18px; line-height: 1.9; border: 2px solid var(--bleu); margin: 15px 0; }
 .word { cursor: pointer; border-bottom: 2px dotted var(--or); }
 .word:hover { background: var(--or); }
 .analysis { background: #FEF3C7; border-left: 5px solid var(--or); padding: 15px; border-radius: 10px; margin: 15px 0; }
 .translation { background: var(--vert); color: white; padding: 15px; border-radius: 12px; margin-top: 15px; display: none; }
 .btn { width: 100%; padding: 16px; background: linear-gradient(135deg, var(--bleu), var(--vert)); color: white; border: none; border-radius: 15px; font-weight: 900; font-size: 16px; cursor: pointer; margin-top: 10px; }
 .btn-audio { background: var(--or); color: var(--noir); padding: 12px 20px; border-radius: 50px; border: none; font-size: 16px; font-weight: 900; }
 .question { background: var(--bg); padding: 18px; border-radius: 12px; margin: 12px 0; }
 .option { padding: 12px; background: white; border: 2px solid var(--bleu); border-radius: 10px; margin: 8px 0; cursor: pointer; font-weight: 600; }
 .option.correct { background: var(--vert); color: white; }
 .option.wrong { background: #EF4444; color: white; }
 .footer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--noir); color: var(--or); text-align: center; padding: 15px; font-weight: 900; }
</style>
</head>
<body>

<div class="header">
  <h1>📖 ENGLISH READER BOSS</h1>
  <p>1ère A & Terminale A - Système Éducatif Ivoirien</p>
  <div>Score BAC: <span id="score">0</span>/20</div>
</div>

<div class="container">

  <!-- MENU CLASSES -->
  <div class="card" id="menu">
    <h2>🎯 CHOISIS TA CLASSE</h2>
    <button class="level-btn" onclick="startLesson('premiere')">📘 1ère A: Thematic Texts<br><small>Education, Technology, Society</small></button>
    <button class="level-btn" onclick="startLesson('terminale')">📕 Terminale A: BAC LEVEL<br><small>Complex Texts + BAC Questions</small></button>
  </div>

  <!-- LECON -->
  <div class="card" id="lesson" style="display:none;">
    <h2 id="lessonTitle"></h2>
    <button class="btn-audio" onclick="readText()">🔊 LISTEN TO TEXT</button>

    <div class="text-box" id="textBox"></div>

    <div class="analysis">
      <b>📚 KEY VOCABULARY:</b>
      <div id="vocab"></div>
    </div>

    <div class="translation" id="translationBox"></div>

    <h3 style="margin-top:20px;">❓ BAC STYLE QUESTIONS</h3>
    <div id="questions"></div>

    <button class="btn" onclick="showTranslation()">🇫🇷 SHOW FULL TRANSLATION</button>
    <button class="btn" onclick="nextLesson()">NEXT TEXT →</button>
  </div>

</div>

<div class="footer">
  CONFORME PROGRAMME BAC CI | SHANKS VORAX 🤴
</div>

<script>
let score = 0;
let currentLevel = 'premiere';
let currentLesson = 0;

const lessons = {
  premiere: [
    {
      title: "TEXT 1: THE IMPORTANCE OF EDUCATION",
      text: "Education is the key to success in modern society. It provides people with knowledge and skills. Through education, individuals can get better jobs and improve their living conditions. However, many children around the world still do not have access to quality education.",
      vocab: {"key":"clé", "success":"réussite", "skills":"compétences", "individuals":"individus", "access":"accès"},
      questions: [
        { q: "What is education the key to?", options: ["Failure", "Success", "Problems"], answer: 1 },
        { q: "What does education provide?", options: ["Money", "Knowledge and skills", "Games"], answer: 1 }
      ]
    }
  ],
  terminale: [
    {
      title: "TEXT 1 BAC: TECHNOLOGY AND SOCIETY",
      text: "In the 21st century, technology has transformed every aspect of our daily lives. While it brings numerous advantages such as instant communication and access to information, it also poses serious challenges. The overuse of digital devices can lead to health problems and social isolation. Therefore, it is crucial to find a balance between technological progress and human well-being.",
      vocab: {"transformed":"transformé", "advantages":"avantages", "challenges":"défis", "overuse":"abus", "isolation":"isolement", "crucial":"crucial"},
      questions: [
        { q: "What are two advantages of technology mentioned?", options: ["Communication and Information", "Food and Travel", "Music and Sports"], answer: 0 },
        { q: "What is one negative effect of technology?", options: ["Health problems", "More money", "Better grades"], answer: 0 },
        { q: "What does the author suggest?", options: ["Stop using technology", "Find a balance", "Use it more"], answer: 1 }
      ]
    },
    {
      title: "TEXT 2 BAC: GLOBALIZATION",
      text: "Globalization refers to the increasing interconnectedness of countries through trade, culture, and technology. It has created new opportunities for economic growth but has also widened the gap between rich and poor nations. Developing countries face the challenge of competing in a global market while preserving their cultural identity.",
      vocab: {"interconnectedness":"interconnexion", "opportunities":"opportunités", "widened":"élargi", "gap":"fossé", "preserving":"préserver"},
      questions: [
        { q: "What is globalization?", options: ["Countries working alone", "Countries connected", "Only trade"], answer: 1 }
      ]
    }
  ]
};

function startLesson(level) {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('lesson').style.display = 'block';
  currentLevel = level;
  currentLesson = 0;
  loadLesson();
}

function loadLesson() {
  const lesson = lessons[currentLevel][currentLesson];
  document.getElementById('lessonTitle').innerText = lesson.title;

  let htmlText = lesson.text.split(' ').map(word =>
    `<span class="word" onclick="showWordDef('${word}')">${word}</span>`
  ).join(' ');
  document.getElementById('textBox').innerHTML = htmlText;

  // Vocabulaire
  let vocabHtml = '';
  for(const [en, fr] of Object.entries(lesson.vocab)) {
    vocabHtml += `<span style="margin-right:15px;"><b>${en}</b> = ${fr}</span>`;
  }
  document.getElementById('vocab').innerHTML = vocabHtml;

  // Questions BAC
  let qHtml = '';
  lesson.questions.forEach((q, i) => {
    qHtml += `<div class="question"><b>Q${i+1}:</b> ${q.q}`;
    q.options.forEach((opt, j) => {
      qHtml += `<div class="option" onclick="checkAnswer(${j}, ${q.answer}, this)">${opt}</div>`;
    });
    qHtml += `</div>`;
  });
  document.getElementById('questions').innerHTML = qHtml;
  document.getElementById('translationBox').style.display = 'none';
}

function showWordDef(word) {
  const lesson = lessons[currentLevel][currentLesson];
  const cleanWord = word.replace('.', '').replace(',', '').toLowerCase();
  const trad = lesson.vocab[cleanWord];
  if(trad) alert(`📖 ${word} = ${trad}`);
}

function showTranslation() {
  const lesson = lessons[currentLevel][currentLesson];
  document.getElementById('translationBox').style.display = 'block';
  document.getElementById('translationBox').innerHTML = `<b>TRADUCTION COMPLÈTE:</b><br>${lesson.translation}`;
}

function checkAnswer(selected, correct, element) {
  document.querySelectorAll('.option').forEach(o => o.onclick = null); // Bloquer
  if(selected === correct) {
    element.classList.add('correct');
    score += 5;
    document.getElementById('score').innerText = score;
  } else {
    element.classList.add('wrong');
    document.querySelectorAll('.option')[correct].classList.add('correct');
  }
}

function readText() {
  const text = lessons[currentLevel][currentLesson].text;
  const speech = new SpeechSynthesisUtterance(text);
  speech.lang = 'en-US';
  speech.rate = 0.9;
  window.speechSynthesis.speak(speech);
}

function nextLesson() {
  currentLesson++;
  if(currentLesson >= lessons[currentLevel].length) {
    alert(`🎉 FIN DU NIVEAU! Score: ${score}/20`);
    score = 0;
    document.getElementById('score').innerText = score;
    document.getElementById('menu').style.display = 'block';
    document.getElementById('lesson').style.display = 'none';
  } else {
    loadLesson();
  }
}
</script>
</body>
</html>
